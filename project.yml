name: ChefNova
options:
  bundleIdPrefix: com.chefnova
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  swift: "6.0"
  createIntermediateGroups: true

packages:
  SwiftCheck:
    url: https://github.com/typelift/SwiftCheck
    from: "0.12.0"

schemes:
  ChefNova:
    build:
      targets:
        ChefNova: all
        ChefNovaTests: [test]
        ChefNovaUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ChefNovaTests
        - ChefNovaUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  ChefNova:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ChefNova
    resources:
      - path: ChefNova/Resources/SynonymDictionary.json
      - path: ChefNova/Resources/PantryStaples.json
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        INFOPLIST_FILE: ChefNova/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.chefnova.ChefNova
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: SwiftData.framework

  ChefNovaTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ChefNovaTests
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.chefnova.ChefNovaTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ChefNova
      - package: SwiftCheck

  ChefNovaUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ChefNovaUITests
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.chefnova.ChefNovaUITests
        TEST_TARGET_NAME: ChefNova
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ChefNova
